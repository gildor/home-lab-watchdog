name: external-tailscale
on:
  schedule:
    # Every 30 min. GitHub's scheduler is best-effort and silently drops/coalesces
    # runs under load (observed ~2h gaps from an hourly cron), which tripped the
    # healthchecks "External to Home" check even though home was reachable. Running
    # twice as often shrinks those gaps; the HC check's grace (~70m) absorbs the rest.
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet (ephemeral, OAuth)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gh-watchdog
      - name: Probe home over Tailscale; ping healthchecks on success
        env:
          TARGET: ${{ secrets.HOME_TARGET }}
          PROBE_HOST: ${{ secrets.PROBE_HOST }}
          HC_URL: ${{ secrets.HC_EXTERNAL_URL }}
        run: |
          # The path home runs through Tailscale DERP relays, so a single probe
          # occasionally clips on transient jitter / DNS wobble / a DHCP-reconfig
          # window — none of which is a real outage. Retry a few times and ping
          # the instant any attempt succeeds; only stay silent (-> HC alerts)
          # when ALL attempts fail. Keeps the "green can't lie" property: HC is
          # still pinged only on a genuine success.
          attempts=4
          delay=10
          for i in $(seq 1 "${attempts}"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "Host: ${PROBE_HOST}" "http://${TARGET}/" || true)
            echo "attempt ${i}/${attempts}: probe http_code=${code}"
            case "${code}" in
              2*|3*)
                if curl -fsS -m 10 "${HC_URL}" >/dev/null; then
                  echo "OK: reachable over Tailscale (attempt ${i}/${attempts}), pinged healthchecks"
                  exit 0
                fi
                echo "probe OK but healthchecks ping failed; will retry"
                ;;
            esac
            if [ "${i}" -lt "${attempts}" ]; then
              echo "retry in ${delay}s"
              sleep "${delay}"
            fi
          done
          echo "FAIL: home unreachable over Tailscale after ${attempts} attempts; NOT pinging -> HC will alert"
          exit 1
