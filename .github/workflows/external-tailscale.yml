name: external-tailscale
# Hourly external probe: joins the tailnet (ephemeral) and checks a home service
# is reachable OVER TAILSCALE from outside the house. On success it pings a
# healthchecks.io check; if pings stop, healthchecks alerts. Nothing here is
# secret — auth key, target and ping URL are GitHub Actions secrets.
on:
  schedule:
    - cron: '7 * * * *'   # ~hourly; GitHub may delay scheduled runs (grace covers it)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet (ephemeral)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-watchdog
      - name: Probe home over Tailscale; ping healthchecks on success
        env:
          TARGET: ${{ secrets.HOME_TARGET }}
          PROBE_HOST: ${{ secrets.PROBE_HOST }}
          HC_URL: ${{ secrets.HC_EXTERNAL_URL }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "Host: ${PROBE_HOST}" "http://${TARGET}/")
          echo "probe http_code=${code}"
          case "${code}" in
            2*|3*) curl -fsS -m 10 "${HC_URL}" >/dev/null && echo "OK: reachable over Tailscale, pinged healthchecks";;
            *) echo "FAIL: home unreachable over Tailscale (code=${code}); NOT pinging -> HC will alert"; exit 1;;
          esac
