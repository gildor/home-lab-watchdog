name: keepalive
# GitHub auto-disables scheduled workflows after 60 days of no repo activity.
# This commits a timestamp twice a month so the external-tailscale probe
# schedule never gets disabled. (GITHUB_TOKEN commits don't trigger other
# workflows, so this won't fire the probe.)
on:
  schedule:
    - cron: '17 6 1,15 * *'   # 1st & 15th ~06:17 UTC — comfortably under 60 days
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "keepalive: keep scheduled workflows enabled" || { echo "no change"; exit 0; }
          git push
